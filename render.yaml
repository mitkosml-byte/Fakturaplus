services:
  - type: web
    name: fakturaplus-backend
    runtime: python
    rootDir: backend
    # Always on: the free plan sleeps after 15 minutes without visitors and
    # the background jobs (morning push, reminders, alerts, monthly backup)
    # sleep with it. The smallest paid plan keeps them running.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: fakturaplus
