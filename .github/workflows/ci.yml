name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: backend
        run: python -m pytest tests/ -v

  backend-typecheck:
    name: Backend typecheck (mypy)
    runs-on: ubuntu-latest
    # Module 1 audit finding #3 ("thin test coverage, no static typing"):
    # mypy started here as an informational-only first pass (232 errors,
    # continue-on-error). The baseline is now clean (0 errors - backend/
    # mypy.ini documents the handful of confirmed library-stub/
    # architecture false positives it suppresses), so this is a real,
    # blocking gate: it now holds the line on NEW errors.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run mypy
        working-directory: backend
        run: python -m mypy server.py routers/ --ignore-missing-imports

  frontend-typecheck:
    name: Frontend typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit -p .

  browser-checks:
    name: Main paths in a browser (Playwright)
    runs-on: ubuntu-latest
    # An owner opens an account, enters the day's takings and an expense,
    # sees them on Home and in Statistics, makes a backup, signs out and back
    # in - in a real browser, against the built app and the server on an
    # in-memory database (e2e/serve.py). Invented data only.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Build the web app (server on the same address)
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ""
        run: |
          npm ci
          npx expo export -p web --output-dir dist
      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the main paths
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test --trace off
