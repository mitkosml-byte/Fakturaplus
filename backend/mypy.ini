[mypy]
# motor/pymongo's AsyncIOMotorCollection.find_one declares its own per-call
# TypeVar (bound to Mapping[str, Any]) instead of reusing the collection's
# own _DocumentType parameter. Nothing in a typical `await
# db.<collection>.find_one(filter)` call constrains that TypeVar, so mypy
# can't solve it and falls back to treating the whole expression as
# returning None only - confirmed via `reveal_type(db.x.find_one)`, which
# shows the method's own unconstrained generic, and by checking every one
# of this codebase's func-returns-value errors: all of them (83 as of
# 2026-10, 100%) are exactly this find_one pattern, not a real
# always-returns-None bug anywhere. Disabling the check project-wide is
# the honest fix here rather than silencing 83 individual call sites.
disable_error_code = func-returns-value
